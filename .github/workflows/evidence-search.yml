name: Support evidence search
on:
  push:
    paths:
      - 'examples/support_evidence_search/**'
      - '.github/workflows/evidence-search.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test pure retrieval logic
        working-directory: examples/support_evidence_search
        run: python -m unittest -v
      - name: Install Python dependencies
        run: pip install -r examples/support_evidence_search/requirements.txt
      - name: Build the fork's Endee server
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang-19 libssl-dev libcurl4-openssl-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DUSE_AVX2=ON
          cmake --build build --parallel 2
      - name: Start server
        run: |
          mkdir -p /tmp/evidence-search-data
          NDD_DATA_DIR=/tmp/evidence-search-data NDD_NUM_THREADS=2 ./build/ndd > /tmp/evidence-search-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/evidence-search-server.log
          exit 1
      - name: Ingest and evaluate real embeddings and database retrieval
        run: |
          python examples/support_evidence_search/search.py ingest --index evidence_ci
          python examples/support_evidence_search/search.py evaluate --index evidence_ci --output examples/support_evidence_search/results/ci-evaluation.json
          python examples/support_evidence_search/search.py search --index evidence_ci --query 'Database connections are exhausted' --category database
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-search-validation
          path: |
            examples/support_evidence_search/results/
            /tmp/evidence-search-server.log
